<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Situação Eleitoral - Aula 2</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
      text-align: center;
    }
    input, button {
      padding: 10px;
      margin: 10px;
      font-size: 16px;
    }
    button {
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
    #resultado {
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <h1>Verificador de Situação Eleitoral</h1>
  
  <label>Digite seu nome:</label><br>
  <input type="text" id="nome" placeholder="Ex: Jaime Silva"><br><br>
  
  <label>Digite sua idade:</label><br>
  <input type="number" id="idade" placeholder="Ex: 17" min="0"><br><br>
  
  <button onclick="verificarSituacao()">Verificar Situação</button>
  <button onclick="limparCampos()">Limpar</button>

  <div id="resultado"></div>

  <script>
    function verificarSituacao() {
      let nome = document.getElementById("nome").value.trim();
      let idadeInput = document.getElementById("idade").value;
      let idade = parseInt(idadeInput);
      let resultado = document.getElementById("resultado");

      // Validação
      if (nome === "") {
        resultado.innerHTML = `<p style="color: red;">❌ Por favor, digite seu nome.</p>`;
        return;
      }
      if (isNaN(idade) || idade < 0) {
        resultado.innerHTML = `<p style="color: red;">❌ Por favor, digite uma idade válida.</p>`;
        return;
      }

      let situacao = "";

      if (idade < 16) {
        situacao = "🚫 Não pode votar";
      } 
      else if (idade >= 16 && idade <= 17) {
        situacao = "🟡 Voto facultativo (opcional)";
      } 
      else if (idade >= 18 && idade <= 70) {
        situacao = "🟢 Voto obrigatório";
      } 
      else {
        situacao = "🟡 Voto facultativo (opcional)";
      }

      resultado.innerHTML = `
        <strong>Olá, ${nome}!</strong><br><br>
        Sua situação eleitoral:<br>
        <strong style="font-size: 20px;">${situacao}</strong>
      `;
    }

    function limparCampos() {
      document.getElementById("nome").value = "";
      document.getElementById("idade").value = "";
      document.getElementById("resultado").innerHTML = "";
    }
  </script>
</body>
</html>
